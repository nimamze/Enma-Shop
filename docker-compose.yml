name: enma-shop

services:
  postgres:
    image: postgres:16-alpine
    container_name: enma-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enma_shop
      POSTGRES_USER: nimamze
      POSTGRES_PASSWORD: emmawatson2181
    ports:
      - "5433:5432"
    volumes:
      - enma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimamze -d enma_shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enma-shop-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "emmawatson2181"]
    ports:
      - "6380:6379"
    volumes:
      - enma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "emmawatson2181", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: enma-shop-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - enma_elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: enma-shop-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  gateway:
    build:
      context: ./Gateway
    container_name: enma-shop-gateway
    restart: unless-stopped
    env_file:
      - ./Gateway/.env
    ports:
      - "8018:8008"

  celery-worker:
    build:
      context: ./Gateway
    container_name: enma-shop-celery-worker
    restart: unless-stopped
    command: celery -A celery worker -l info
    env_file:
      - ./Gateway/.env

  celery-beat:
    build:
      context: ./Gateway
    container_name: enma-shop-celery-beat
    restart: unless-stopped
    command: celery -A celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./Gateway/.env

volumes:
  enma_postgres_data:
  enma_redis_data:
  enma_elasticsearch_data: