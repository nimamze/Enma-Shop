name: enma-shop

services:
  enma-shop-postgres:
    image: postgres:16-alpine
    container_name: enma-shop-postgres
    restart: unless-stopped
    env_file:
      - ./Enma_Shop/.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - enma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  enma-shop-redis:
    image: redis:7-alpine
    container_name: enma-shop-redis
    restart: unless-stopped
    env_file:
      - ./Enma_Shop/.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - enma_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  enma-shop-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: enma-shop-elasticsearch
    restart: unless-stopped
    env_file:
      - ./Enma_Shop/.env
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - enma_elasticsearch_data:/usr/share/elasticsearch/data

  enma-shop-kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: enma-shop-kibana
    restart: unless-stopped
    env_file:
      - ./Enma_Shop/.env
    ports:
      - "127.0.0.1:5601:5601"

  enma-shop-gateway:
    build:
      context: ./Enma_Shop
    container_name: enma-shop-gateway
    restart: unless-stopped
    env_file:
      - ./Enma_Shop/.env
    ports:
      - "127.0.0.1:8018:8008"

  enma-shop-celery-worker:
    build:
      context: ./Enma_Shop
    container_name: enma-shop-celery-worker
    restart: unless-stopped
    command: celery -A CentralManagement.celery_app worker -l info
    env_file:
      - ./Enma_Shop/.env

  enma-shop-celery-beat:
    build:
      context: ./Enma_Shop
    container_name: enma-shop-celery-beat
    restart: unless-stopped
    command: celery -A CentralManagement.celery_app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ./Enma_Shop/.env

volumes:
  enma_postgres_data:
  enma_redis_data:
  enma_elasticsearch_data:
